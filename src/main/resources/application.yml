server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/epc_ia}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

security:
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-jwt-por-uma-chave-segura-de-64-caracteres}
    expiration: ${JWT_EXPIRATION:86400000}

ia:
  base-url: ${IA_BASE_URL:http://localhost:8000}
